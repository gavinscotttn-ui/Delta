<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="praxis-token" content="__PRAXIS_TOKEN__">
<title>Praxis</title>
<link rel="icon" href="/icon.png">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000; --sub:#8E8E93; --hair:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12);
  --accent:#D7036A; --accent-soft:rgba(215,3,106,.1); --green:#34C759; --red:#FF3B30;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#000; --card:#1C1C1E; --text:#fff; --sub:#8E8E93; --hair:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24);
  --accent:#FF2D87; --accent-soft:rgba(255,45,135,.16); color-scheme:dark;
}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,"SF Pro Text","Segoe UI Variable Text","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px max(16px,calc(50% - 440px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--hair)}
.bar img{width:26px;height:26px}
.bar h1{font-size:17px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--accent)}
.ibtn:hover{background:var(--fill)}
.ibtn.on{background:var(--accent);color:#fff}
.vol{display:flex;align-items:center;gap:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:110px;height:4px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,50%) 100% no-repeat,var(--fill)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 4px rgba(0,0,0,.25)}

main{max-width:880px;margin:0 auto;padding:8px 16px 120px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:28px 4px 8px}
.head h2{font-size:13px;font-weight:400;color:var(--sub);text-transform:uppercase;letter-spacing:.02em}
.link{color:var(--accent);font-size:15px}
.link:hover{opacity:.7}
.foot{font-size:13px;color:var(--sub);margin:8px 16px 0}

.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:8px 16px;position:relative;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--hair)}
.row .k{flex:1;min-width:0;white-space:nowrap}
.row>input[type=text],.row>input[type=password]{flex:2}
.row .v{color:var(--sub);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.stack{flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px}
.row input[type=text],.row input[type=password],.row select{border:0;background:transparent;text-align:right;outline:none;min-width:0;width:100%}
.row.stack input[type=text],.row.stack textarea{text-align:left;background:var(--fill);border:0;border-radius:8px;padding:8px 10px;outline:none;width:100%}
.row select{appearance:none;-webkit-appearance:none;color:var(--accent);cursor:pointer}
textarea{resize:vertical;min-height:60px}

.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2),0 0 0 .5px rgba(0,0,0,.04);transition:transform .2s}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(20px)}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:var(--text)}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 16px;border-radius:10px;background:var(--fill);color:var(--accent);font-weight:500}
.btn:hover{filter:brightness(.97)}
.btn.fill{background:var(--accent);color:#fff}
.kbd{display:inline-block;min-width:24px;padding:3px 10px;border-radius:7px;background:var(--fill);font-weight:500;font-size:13px;color:var(--text);text-align:center;border:1px solid transparent}
.kbd.rec{border-color:var(--accent);color:var(--accent)}
.kbd.empty{color:var(--sub)}

.hero{display:flex;align-items:center;gap:16px;padding:18px 16px;flex-wrap:wrap}
.hero .glyph{width:52px;height:52px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.hero .glyph svg{width:28px;height:28px}
.hero h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
.hero p{color:var(--sub);font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.status.live{color:var(--accent)}.status.live i{background:var(--accent)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;min-height:118px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .glyph{width:40px;height:40px;border-radius:10px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:600;font-size:17px}
.tile .nm{font-weight:500;font-size:15px;line-height:1.25}
.tile .hk{font-size:12px;color:var(--sub)}
.tile.active{box-shadow:inset 0 0 0 2px var(--c)}
.tile .dot{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.tile .warn{position:absolute;top:12px;right:12px;font-size:11px;color:var(--red)}
.tile.flash{animation:flash .35s}
@keyframes flash{50%{background:var(--fill)}}
.editing .tile:not(.add){cursor:grab}
.editing .tile:not(.add)::after{content:"Edit";position:absolute;right:14px;bottom:14px;font-size:13px;color:var(--accent)}
.tile.drop{box-shadow:inset 0 0 0 2px var(--accent)}
.tile.add{border:1.5px dashed var(--hair);background:transparent;align-items:center;justify-content:center;color:var(--accent)}

.mons{position:relative;height:96px;background:var(--fill);border-radius:10px}
.mons button{position:absolute;border-radius:5px;background:var(--card);border:1.5px solid var(--hair);font-weight:600;color:var(--sub);font-size:14px}
.mons button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}

.pill{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);display:flex;align-items:center;gap:14px;background:var(--card);border-radius:28px;padding:8px 8px 8px 20px;box-shadow:0 10px 40px rgba(0,0,0,.18),0 0 0 .5px var(--hair);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);z-index:20}
.pill:not(.show){visibility:hidden;transition:transform .3s,visibility 0s .3s}
.pill.show{transform:translate(-50%,0)}
.pill .btn{border-radius:20px}

dialog{margin:auto;border:0;padding:0;background:var(--bg);color:var(--text);border-radius:14px;width:min(560px,calc(100vw - 24px));max-height:min(88vh,860px);box-shadow:0 20px 70px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog[open]{animation:rise .28s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.sh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:12px 16px;border-bottom:.5px solid var(--hair);background:var(--card)}
.sh h3{font-size:17px;font-weight:600;text-align:center}
.sh .l{justify-self:start}.sh .r{justify-self:end;font-weight:600}
.sb{padding:4px 16px 24px;overflow:auto;max-height:calc(min(88vh,860px) - 56px)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icons button{height:40px;border-radius:10px;display:grid;place-items:center;color:var(--sub)}
.icons button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:28px;height:28px;border-radius:50%}
.colors button[aria-pressed=true]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.tools{display:flex;gap:2px;margin-left:auto}
.tools button{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--sub)}
.tools button:hover{background:var(--fill);color:var(--text)}
.tools button:disabled{opacity:.3}
.tools svg{width:18px;height:18px}
.step.off .lbl{opacity:.4}
.n{width:22px;height:22px;border-radius:50%;background:var(--fill);font-size:12px;display:grid;place-items:center;color:var(--sub);flex:none}
.hint{font-size:12.5px;color:var(--sub)}
.err{color:var(--red);font-size:13px;margin:10px 4px 0;min-height:1em}
.picklist button{width:100%}
.picklist small{display:block;color:var(--sub);font-size:12px}
.log{font:12px/1.6 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--sub);max-height:220px;overflow:auto;padding:10px 16px}
.log .warn,.log .error{color:var(--red)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card);border-radius:12px;padding:10px 16px;box-shadow:0 8px 30px rgba(0,0,0,.15);font-size:14px;z-index:40}
.toast.bad{color:var(--red)}
@media (max-width:560px){.vol input{width:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bar">
  <img src="/logo.png" alt="">
  <h1>Praxis</h1>
  <div class="vol">
    <button class="ibtn" id="muteBtn" aria-label="Mute"></button>
    <label class="sr" for="vol">Volume</label><input type="range" id="vol" min="0" max="100">
  </div>
  <button class="ibtn" id="micBtn" aria-label="Mute microphone"></button>
  <button class="ibtn" id="setBtn" aria-label="Settings"></button>
</div>

<main>
  <div id="banner"></div>
  <div class="head"><h2>Switch</h2><span class="status" id="swStatus"><i></i><span>Ready</span></span></div>
  <div class="group" id="switchCard"></div>
  <p class="foot" id="swFoot"></p>

  <div class="head"><h2>Shortcuts</h2><button class="link" id="editBtn">Edit</button></div>
  <div class="tiles" id="tiles"></div>
</main>

<div class="pill" id="pill" role="status" aria-live="polite"><span>Switched</span><button class="btn fill" id="returnBtn">Return</button></div>

<dialog id="ed" aria-labelledby="edT">
  <div class="sh"><button class="link l" id="edCancel">Cancel</button><h3 id="edT">Shortcut</h3><button class="link r" id="edSave">Done</button></div>
  <div class="sb" id="edBody"></div>
</dialog>

<dialog id="st" aria-labelledby="stT">
  <div class="sh"><span></span><h3 id="stT">Settings</h3><button class="link r" id="stDone">Done</button></div>
  <div class="sb" id="stBody"></div>
</dialog>

<dialog id="pk" aria-labelledby="pkT">
  <div class="sh"><button class="link l" id="pkCancel">Cancel</button><h3 id="pkT">Choose an App</h3><span></span></div>
  <div class="sb"><p class="foot" style="margin:12px 4px">Open the app first, then choose its window.</p><div class="group picklist" id="pkList"></div></div>
</dialog>

<script>
"use strict";
const TOKEN = document.querySelector('meta[name="praxis-token"]').content;
const $ = s => document.querySelector(s);

function h(tag, a, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(a||{})){
    if (v === false || v == null) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'style') for (const [p,val] of Object.entries(v)) p.startsWith('--') ? el.style.setProperty(p,val) : (el.style[p]=val);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

// ---------- line icons (drawn here, no icon fonts or emoji) ----------
const P = {
  bolt:'M13 2 4 14h7l-1 8 9-12h-7z',
  'eye-off':'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM3 3l18 18',
  eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z',
  'volume-off':'M11 5 6 9H3v6h3l5 4zM16 9l5 6M21 9l-5 6',
  volume:'M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13',
  'mic-off':'M9 5a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0zM5 11a7 7 0 0 0 14 0M12 18v3M3 3l18 18',
  mic:'M9 5a3 3 0 0 1 6 0v6a3 3 0 0 1-6 0zM5 11a7 7 0 0 0 14 0M12 18v3',
  play:'M7 4l13 8-13 8z',
  lock:'M7 11h10a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2zM8 11V7a4 4 0 0 1 8 0v4',
  briefcase:'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2',
  moon:'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
  monitor:'M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 21h8M12 17v4',
  keyboard:'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10',
  globe:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18',
  mail:'M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 7l9 6 9-6',
  phone:'M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z',
  chart:'M5 20V11M12 20V5M19 20v-6',
  return:'M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3',
  star:'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z',
  sliders:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',
  up:'M12 19V5M6 11l6-6 6 6', down:'M12 5v14M18 13l-6 6-6-6',
  trash:'M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13', plus:'M12 5v14M5 12h14',
};
const TILE_ICONS = ['monitor','eye-off','volume-off','volume','mic-off','play','lock','briefcase','moon','keyboard','globe','mail','phone','chart','return','star','bolt'];
function icon(name){
  const ns = 'http://www.w3.org/2000/svg', s = document.createElementNS(ns,'svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','i'); s.setAttribute('aria-hidden','true');
  const p = document.createElementNS(ns,'path'); p.setAttribute('d', P[name]||P.bolt); s.append(p);
  return s;
}
const glyph = m => m.icon && P[m.icon] ? icon(m.icon) : (m.name||'?').trim().charAt(0).toUpperCase();

async function api(method, path, body){
  const o = {method, headers:{'X-Praxis-Token':TOKEN}};
  if (body !== undefined){ o.headers['Content-Type']='application/json'; o.body=JSON.stringify(body); }
  let r; try{ r = await fetch(path, o); }catch{ throw new Error('Praxis is not responding.'); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong ('+r.status+')');
  return d;
}
let toastT;
function toast(msg, bad){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = h('div',{class:'toast'+(bad?' bad':''), role:'status'}, msg); document.body.append(t);
  clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), bad?5000:1800);
}

const ACTIONS = {
  mute:['Sound','Mute'], unmute:['Sound','Unmute'], toggle_mute:['Sound','Mute on or off'],
  set_volume:['Sound','Set volume',['vol']], volume_step:['Sound','Change volume',['step']],
  mic_mute:['Sound','Mute microphone'], mic_unmute:['Sound','Unmute microphone'], mic_toggle:['Sound','Microphone on or off'],
  media:['Sound','Media key',['media','undo']],
  minimize_foreground:['Windows','Hide the active window',['hidemode']],
  minimize_apps:['Windows','Hide apps',['match','hidemode']],
  minimize_all:['Windows','Show the desktop'],
  fill_screens:['Windows','Show an app on screens',['app','args','monitors','fit','closeOnRestore']],
  focus_app:['Windows','Bring an app forward',['match']],
  close_app:['Windows','Close an app',['match']],
  launch:['Open','Open an app or file',['app','args','win']],
  open_url:['Open','Open a website',['url']],
  run_command:['Open','Run a command',['cmd']],
  send_keys:['Keyboard','Press keys',['keys']],
  type_text:['Keyboard','Type text',['text']],
  clear_clipboard:['Keyboard','Clear the clipboard'],
  lock:['System','Lock the PC'], monitors_off:['System','Turn screens off'],
  wait:['System','Wait',['wait']], notify:['System','Show a notification',['text']],
  restore:['System','Return (undo switches)'],
};
const COLORS = ['#D7036A','#FF3B30','#FF9500','#FFCC00','#34C759','#5AC8FA','#007AFF','#5856D6','#8E8E93','#1C1C1E'];

let S = null, cfg = null, sig = '', editMode = false, ed = null;

async function refresh(){
  try{
    S = await api('GET','/api/state');
    if (!ed && !$('#st').open && !swDirty) cfg = S.config;
    $('#banner').replaceChildren();
    render();
  }catch(e){ $('#banner').replaceChildren(h('p',{class:'err',style:{margin:'16px 4px'}}, e.message)); }
}

function render(){
  const a = S.audio||{};
  $('#muteBtn').replaceChildren(icon(a.muted?'volume-off':'volume'));
  $('#muteBtn').classList.toggle('on', !!a.muted);
  $('#muteBtn').setAttribute('aria-label', a.muted?'Unmute':'Mute');
  if (document.activeElement !== $('#vol')){ $('#vol').value = a.volume||0; paintVol(); }
  $('#vol').disabled = !a.available;
  $('#micBtn').replaceChildren(icon(a.micMuted?'mic-off':'mic'));
  $('#micBtn').classList.toggle('on', !!a.micMuted);
  $('#micBtn').hidden = !!a.micError;
  $('#pill').classList.toggle('show', (S.active||[]).length>0);
  const s = JSON.stringify([cfg.macros, S.hotkeys, S.active, S.paused, (S.monitors||[]).length]);
  if (s !== sig){ sig = s; if (!swFocus()) renderSwitch(); renderTiles(); }
}
function paintVol(){ $('#vol').style.setProperty('--p', $('#vol').value+'%'); }

// ---------- Switch card ----------
const SW_TYPES = ['mute','media','minimize_foreground','minimize_apps','fill_screens'];
let swDirty = false, swTimer = null;
const swMacro = () => cfg.macros.find(m=>m.id==='switch');
const swFocus = () => $('#switchCard').contains(document.activeElement) && document.activeElement.matches('input[type=text]');

function swRead(m){
  const f = t => m.actions.find(a=>a.type===t && !a.disabled);
  const fill = f('fill_screens');
  return {mute:!!f('mute'), media:!!f('media'), front:!!f('minimize_foreground'),
    apps:(f('minimize_apps')||{}).match||'', mode:(f('minimize_foreground')||f('minimize_apps')||{}).mode||'minimize',
    app:fill?.target||'', match:fill?.match||'', monitors:fill?.monitors||[]};
}
function swWrite(m, o){
  const rest = m.actions.filter(a=>!SW_TYPES.includes(a.type));
  const acts = [];
  if (o.mute) acts.push({type:'mute'});
  if (o.media) acts.push({type:'media', target:'play_pause'});
  if (o.front) acts.push({type:'minimize_foreground', mode:o.mode});
  if (o.apps.trim()) acts.push({type:'minimize_apps', match:o.apps, mode:o.mode});
  if (o.app.trim()) acts.push({type:'fill_screens', target:o.app.trim(), match:o.match||'', monitors:o.monitors, mode:'maximize', launch:true, timeout:6000});
  m.actions = [...acts, ...rest]; m.toggle = true; m.undoable = true;
}
function swSave(){
  swDirty = true; clearTimeout(swTimer);
  swTimer = setTimeout(async ()=>{

function monitorPicker(sel, cb){
  const mons = S.monitors||[], box = h('div',{class:'mons', role:'group','aria-label':'Screens'});

  const x0=Math.min(...mons.map(m=>m.x)), y0=Math.min(...mons.map(m=>m.y));

    const k = Math.min((W-2*pad)/(x1-x0), (H-2*pad)/(y1-y0)), ox = (W-(x1-x0)*k)/2, oy = (H-(y1-y0)*k)/2;

      onclick:()=>{ cur.has(m.index) ? cur.delete(m.index) : cur.add(m.index); if (!cur.size) cur.add(m.index); draw();

const CODES = {Space:'Space',Enter:'Enter',NumpadEnter:'Enter',Escape:'Esc',Tab:'Tab',Backspace:'Backspace',Pause:'Pause',ScrollLock:'ScrollLock',
  PrintScreen:'PrintScreen',Insert:'Insert',Delete:'Delete',Home:'Home',End:'End',PageUp:'PageUp',PageDown:'PageDown',
  ArrowLeft:'Left',ArrowRight:'Right',ArrowUp:'Up',ArrowDown:'Down',NumpadMultiply:'NumMul',NumpadAdd:'NumAdd',NumpadSubtract:'NumSub',
  NumpadDecimal:'NumDec',NumpadDivide:'NumDiv',Semicolon:'Semicolon',Equal:'Equal',Comma:'Comma',Minus:'Minus',Period:'Period',Slash:'Slash',
  Backquote:'Backquote',BracketLeft:'BracketLeft',Backslash:'Backslash',BracketRight:'BracketRight',Quote:'Quote',
  MediaPlayPause:'MediaPlayPause',MediaTrackNext:'MediaNext',MediaTrackPrevious:'MediaPrev',MediaStop:'MediaStop',
  AudioVolumeMute:'VolumeMute',AudioVolumeDown:'VolumeDown',AudioVolumeUp:'VolumeUp'};
function keyName(e){
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3);
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^Numpad\d$/.test(c)) return 'Num'+c.slice(6);
  if (/^F([1-9]|1\d|2[0-4])$/.test(c)) return c;
  if (e.key==='Pause') return 'Pause';
  return CODES[c]||null;
}
let rec = null;
function hotkeyChip(val, cb, global=true){
  const chip = h('button',{type:'button', class:'kbd'+(val?'':' empty'), title:'Click, then press the keys. Backspace clears.'}, val||'None');
  chip.onclick = ()=>{
    stopRec();
    rec = {chip, cb, val, global};
    chip.classList.add('rec'); chip.textContent = 'Press keys';
    if (global && !S.paused){ rec.resume = true; api('POST','/api/hotkeys',{paused:true}).catch(()=>{}); }
  };
  chip.addEventListener('blur', ()=>{ if (rec && rec.chip===chip) stopRec(); });
  return chip;
}
function stopRec(){
  if (!rec) return;
  const r = rec; rec = null;
  r.chip.classList.remove('rec');
  if (r.chip.textContent==='Press keys') r.chip.textContent = r.val || 'None';
  if (r.resume) api('POST','/api/hotkeys',{paused:false}).catch(()=>{});
}
document.addEventListener('keydown', e=>{
  if (!rec) return;
  e.preventDefault(); e.stopPropagation();
  const plain = !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey;
  if (e.key==='Escape' && plain){ stopRec(); return; }
  if ((e.key==='Backspace'||e.key==='Delete') && plain){ const r = rec; r.val=''; r.chip.classList.add('empty'); r.cb(''); r.chip.textContent='None'; stopRec(); return; }
  const k = keyName(e); if (!k) return;
  const v = [e.ctrlKey&&'Ctrl', e.altKey&&'Alt', e.shiftKey&&'Shift', e.metaKey&&'Win', k].filter(Boolean).join('+');
  const r = rec; r.val = v; r.chip.textContent = v; r.chip.classList.remove('empty'); r.cb(v); stopRec();
}, true);

    h('p',{class:'foot'},'With the tray icon off, open Praxis again from its file to show this window. History stays in memory unless kept on disk.'),
    h('div',{class:'head'}, h('h2',{},'Phone')),
    grp(h('div',{class:'row'}, h('span',{class:'k'},'PIN'), pin, h('button',{class:'link',onclick:async()=>{
          try{ await api('POST','/api/pin',{pin:pin.value}); pin.value=''; toast('PIN saved'); await refresh(); drawSettings(); }catch(e){ toast(e.message,true); } }},'Save')),
        srow('Use from phone', sw(r.enabled, v=>setSetting(x=>x.remote.enabled=v))),
        srow('Address', h('span',{class:'v',style:{userSelect:'all'}}, addr))),
    h('p',{class:'foot'},'Same Wi-Fi only. PIN of 6 or more characters; five wrong tries locks out for five minutes. Not encrypted, so trusted networks only.'),
    h('div',{class:'head'}, h('h2',{},'Shortcuts')),
    grp(arow('Export','var(--accent)',exportCfg), arow('Import','var(--accent)',()=>imp.click()), arow('Reset to Originals','var(--red)',resetCfg)),
    h('div',{class:'head'}, h('h2',{},'Activity')),
    grp(h('div',{class:'log'}, ...(S.log||[]).slice(-60).reverse().map(e=>h('div',{class:e.level}, new Date(e.time).toLocaleTimeString()+'  '+e.msg)))),
    h('p',{class:'foot'},'Praxis '+S.version));
}
const imp = h('input',{type:'file',accept:'.json,application/json',hidden:true,onchange:async e=>{
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  try{ const d = JSON.parse(await f.text()); if (!Array.isArray(d.macros)) throw new Error('No shortcuts in that file.');
    if (!confirm('Replace your shortcuts with '+d.macros.length+' imported ones?')) return;
    const next = structuredClone(S.config); next.macros = d.macros; await saveConfig(next); drawSettings(); toast('Imported');
  }catch(err){ toast('Import failed: '+err.message, true); } }});
document.body.append(imp);
function exportCfg(){
  const a = h('a',{href:URL.createObjectURL(new Blob([JSON.stringify({praxis:1,macros:S.config.macros},null,2)],{type:'application/json'})),download:'praxis-shortcuts.json'});
  document.body.append(a); a.click(); a.remove();
}
async function resetCfg(){
  if (!confirm('Replace all shortcuts with the originals? Settings are kept.')) return;
  try{ await api('POST','/api/defaults'); await refresh(); drawSettings(); toast('Reset'); }catch(e){ toast(e.message,true); }
}

refresh();
setInterval(()=>{ if (!document.hidden) refresh(); }, 2000);
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) refresh(); });
</script>
</body>
</html>
