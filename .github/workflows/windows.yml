name: windows-build
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet and unit tests
        run: |
          go vet ./...
          go test ./...
      - name: Build Praxis.exe
        # symbols kept on purpose: stripped Go binaries look "packed" to antivirus heuristics
        run: go build -trimpath -ldflags "-H windowsgui -X main.version=1.0.${{ github.run_number }}" -o Praxis.exe .
      - name: Windows integration self-test
        shell: pwsh
        run: |
          go build -o praxis-selftest.exe .
          ./praxis-selftest.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real launch smoke test (start exe, drive the API, run Panic, restore)
        shell: pwsh
        run: |
          $env:PRAXIS_HOME = Join-Path $env:RUNNER_TEMP 'praxis-home'
          $p = Start-Process -FilePath .\Praxis.exe -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 4
          function Show-Crash { Get-ChildItem $env:PRAXIS_HOME -Filter *.log | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName } }
          if ($p.HasExited) { Write-Host "Praxis exited at startup (code $($p.ExitCode))"; Show-Crash; exit 1 }
          $url = (Get-Content (Join-Path $env:PRAXIS_HOME 'deck.url')).Trim()
          $html = (Invoke-WebRequest $url -UseBasicParsing).Content
          $tok = [regex]::Match($html, 'praxis-token" content="([0-9a-f]+)"').Groups[1].Value
          $h = @{ 'X-Praxis-Token' = $tok }
          $st = Invoke-RestMethod "${url}api/state" -Headers $h
          Write-Host "hotkeys:" ($st.hotkeys | ConvertTo-Json -Compress) "audio:" ($st.audio | ConvertTo-Json -Compress)
          if ($st.version -ne "1.0.${{ github.run_number }}") { Write-Host "version not stamped: $($st.version)"; exit 1 }
          $note = Invoke-RestMethod -Method Put "${url}api/notes" -Headers $h -ContentType 'application/json' -Body '{"title":"ci","body":"hello"}'
          $notes = @(Invoke-RestMethod "${url}api/notes" -Headers $h)
          if ($notes.Count -ne 1 -or $notes[0].id -ne $note.id) { Write-Host 'notes did not round-trip'; exit 1 }
          if (-not (Test-Path (Join-Path $env:PRAXIS_HOME 'notes.json'))) { Write-Host 'notes.json not written'; exit 1 }
          if ((Invoke-WebRequest "${url}bar" -UseBasicParsing).StatusCode -ne 200) { Write-Host 'bar page missing'; exit 1 }
          $ws = Invoke-WebRequest "${url}astra/" -UseBasicParsing
          if ($ws.Content -notmatch 'praxis-embed.js' -or $ws.Content -match 'huggingface') { Write-Host 'workspace page not prepared'; exit 1 }
          $lite = Invoke-WebRequest "${url}astra/popup.html" -UseBasicParsing
          if ($lite.Content -notmatch '<title>Praxis Lite</title>' -or $lite.Content -notmatch 'praxis-embed.js') { Write-Host 'Praxis Lite page not prepared'; exit 1 }
          if ($st.config.macros.id -notcontains 'lite' -or $st.config.macros.id -notcontains 'triage') { Write-Host 'workspace keys missing'; exit 1 }
          $appjs = Invoke-WebRequest "${url}astra/js/app.js" -UseBasicParsing
          if ($appjs.Headers['Content-Type'] -notlike 'text/javascript*') { Write-Host "workspace script type: $($appjs.Headers['Content-Type'])"; exit 1 }
          Invoke-RestMethod -Method Put "${url}api/kv/astra.ci" -Headers $h -ContentType 'text/plain' -Body 'saved' | Out-Null
          if (-not (Select-String -Path (Join-Path $env:PRAXIS_HOME 'kv.json') -Pattern 'astra.ci' -Quiet)) { Write-Host 'workspace not saved'; exit 1 }
          Invoke-RestMethod -Method Post "${url}api/run/switch" -Headers $h | Out-Null
          Start-Sleep -Seconds 4
          $st = Invoke-RestMethod "${url}api/state" -Headers $h
          if ($st.active -notcontains 'switch') { Write-Host 'switch did not register as active'; $st.log | Select-Object -Last 15 | Format-Table -AutoSize | Out-String -Width 300; exit 1 }
          if (-not (Get-Process notepad -ErrorAction SilentlyContinue)) { Write-Host 'switch did not open notepad'; exit 1 }
          Invoke-RestMethod -Method Post "${url}api/restore" -Headers $h | Out-Null
          for ($i = 0; $i -lt 10; $i++) { Invoke-RestMethod "${url}api/state" -Headers $h | Out-Null; Start-Sleep -Milliseconds 300 }
          $st = Invoke-RestMethod "${url}api/state" -Headers $h
          $st.log | Select-Object -Last 12 | ForEach-Object { "$($_.level)  $($_.msg)" }
          if ($p.HasExited) { Write-Host 'Praxis died during the test'; Show-Crash; exit 1 }
          if ($st.active.Count -ne 0) { Write-Host 'return did not clear switch'; exit 1 }
          Write-Host ("Memory: {0:N1} MB working set" -f ((Get-Process -Id $p.Id).WorkingSet64 / 1MB))
          Stop-Process -Id $p.Id
          Write-Host 'SMOKE OK'
      - uses: actions/upload-artifact@v4
        with:
          name: Praxis
          path: Praxis.exe

  workspace:
    # The workspace (Astra) has its own tests: content, replies, triage, tools and its pages in a browser.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  release:
    # Only publish once the Windows build and self-test above have passed.
    # Every push to the release branch becomes the new "latest" release, so
    # https://github.com/<owner>/<repo>/releases/latest/download/Praxis.exe always works.
    needs: [build, workspace]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/claude/pensive-einstein-ei4zkk' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Praxis
      - name: Checksum
        run: |
          sum=$(sha256sum Praxis.exe | cut -d' ' -f1)
          cat > notes.md <<NOTES
          **Download \`Praxis.exe\` below, then double-click it.** No installer or admin rights needed.

          SHA-256: \`$sum\`

          Praxis is not code-signed yet, so Windows SmartScreen and some antivirus tools (Avast, AVG) may warn about
          or quarantine it because it is new and unknown. Check the SHA-256 above matches your file (in PowerShell:
          \`Get-FileHash .\\Praxis.exe\`), then allow it in your antivirus.
          NOTES
          sed -i 's/^          //' notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: Praxis.exe
          body_path: notes.md
          tag_name: v1.0.${{ github.run_number }}
          name: Praxis 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
