name: windows-build
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet and unit tests
        run: |
          go vet ./...
          go test ./...
      - name: Build Praxis.exe
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o Praxis.exe .
      - name: Windows integration self-test
        shell: pwsh
        run: |
          go build -o praxis-selftest.exe .
          ./praxis-selftest.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Praxis
          path: Praxis.exe

  release:
    # Only publish once the Windows build and self-test above have passed.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Praxis
      - uses: softprops/action-gh-release@v2
        with:
          files: Praxis.exe
          make_latest: true
          body: |
            **Download `Praxis.exe` below, then double-click it.** No installer or admin rights needed; it lives in the system tray.
            Windows SmartScreen may warn because the exe is unsigned: click **More info → Run anyway**.

            Default hotkeys: **Pause** = Panic (press again to undo), **Shift+Pause** = All clear.
            Change the panic app (Notepad by default) by clicking ✎ on the Panic tile.
