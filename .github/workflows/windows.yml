name: windows-build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet and unit tests
        run: |
          go vet ./...
          go test ./...
      - name: Build Praxis.exe
        run: go build -trimpath -ldflags "-s -w -H windowsgui" -o Praxis.exe .
      - name: Windows integration self-test
        shell: pwsh
        run: |
          go build -o praxis-selftest.exe .
          ./praxis-selftest.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: Praxis
          path: Praxis.exe
