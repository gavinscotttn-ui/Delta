<!doctype html>
<html lang="en-GB" class="lite-root">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Astra Lite</title>
  <link rel="stylesheet" href="css/astra.css">
  <link rel="stylesheet" href="css/popup.css">
  <script src="js/theme.js"></script>
</head>
<body class="lite">
  <header class="lite-top">
    <div class="lite-head">
      <h1 class="lite-title"><img class="lite-logo" alt="Astra Lite" src="assets/astra-logo.png"></h1>
      <div class="lite-head-actions">
        <button class="small-btn" id="keepOpen" type="button" title="Open Astra Lite in the side panel, where it stays open while you work">Keep open</button>
        <button class="small-btn" id="openAstra" type="button">Open Astra</button>
      </div>
    </div>
    <div class="lite-search" role="search">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m10.6 10.6 3.6 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="liteSearch" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="liteView" aria-label="Search Astra" aria-describedby="liteHint" placeholder="Replies, templates, guides, numbers" autocomplete="off" spellcheck="false" autofocus>
      <p class="sr-only" id="liteHint">Up and down arrows move through the results; Enter copies or opens.</p>
      <p class="sr-only" id="liteCount" aria-live="polite"></p>
    </div>
  </header>
  <main class="lite-view" id="liteView"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/seed/registry.js"></script>
  <script src="js/net-tools.js"></script>
  <script src="js/uk-numbers.js"></script>
  <script src="js/numbers.js"></script>
  <script src="js/replies.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
